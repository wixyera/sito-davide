<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Virtuale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif;}

body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.10), transparent 45%),
    linear-gradient(135deg,#3b0764 0%,#581c87 45%,#7e22ce 100%);
  overflow:hidden;position:relative;
}
body::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:26px 26px;
}

.top{text-align:center;margin-bottom:26px;position:relative;z-index:1;}
h1{color:#fff;font-weight:700;font-size:1.6rem;letter-spacing:.02em;}
.subtitle{color:#e9d5ff;font-weight:600;font-size:.85rem;margin-top:4px;}
.hint{color:rgba(233,213,255,.6);font-size:.72rem;margin-top:10px;font-family:'Fira Code',monospace;letter-spacing:.03em;}

.controls{display:flex;gap:10px;margin:16px 0 26px;z-index:1;flex-wrap:wrap;justify-content:center;}
.ctrl-btn{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;
  font-family:'Fira Code',monospace;font-weight:600;font-size:.75rem;letter-spacing:.03em;
  padding:9px 16px;border-radius:20px;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px);
}
.ctrl-btn:hover{background:rgba(255,255,255,.2);}
.ctrl-btn.active{background:#fff;color:#581c87;}

.piano{
  display:flex;position:relative;z-index:1;background:#1c0c2e;padding:14px;border-radius:16px;
  box-shadow:0 30px 70px -18px rgba(0,0,0,.6);
}
.key{
  position:relative;cursor:pointer;user-select:none;transition:transform .06s;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;
  font-family:'Fira Code',monospace;font-size:.68rem;
}
.key.white{
  width:52px;height:210px;background:linear-gradient(180deg,#fdf4ff,#f3e8ff);
  border:1px solid #c084fc;border-radius:0 0 8px 8px;color:#7e22ce;z-index:1;
}
.key.white.active{background:linear-gradient(180deg,#e9d5ff,#d8b4fe);transform:translateY(2px);}
.key.black{
  width:34px;height:130px;background:linear-gradient(180deg,#3b0764,#1c0c2e);
  border-radius:0 0 6px 6px;color:#e9d5ff;position:absolute;top:0;z-index:2;
  margin-left:-17px;box-shadow:0 4px 10px rgba(0,0,0,.5);
}
.key.black.active{background:linear-gradient(180deg,#7e22ce,#581c87);transform:translateY(2px);}

.back-link{position:fixed;top:14px;left:14px;font-size:13px;color:#fff;text-decoration:none;font-weight:600;background:rgba(0,0,0,.2);padding:9px 15px;border-radius:20px;transition:all .25s;backdrop-filter:blur(4px);z-index:2;}
.back-link:hover{background:rgba(0,0,0,.32);}

@media(max-width:600px){
  .key.white{width:38px;height:160px;}
  .key.black{width:24px;height:100px;margin-left:-12px;}
}
</style>
</head>
<body>
<a class="back-link" href="../index.html" onclick="if(window.history.length>1){history.back();return false;}">← Indietro</a>
<div class="top">
  <h1>🎹 Piano Virtuale</h1>
  <p class="subtitle">Suona con il mouse o con la tastiera del computer</p>
  <p class="hint">tasti: A S D F G H J K = note bianche · W E T Y U = note nere</p>
</div>

<div class="controls">
  <button class="ctrl-btn active" data-wave="sine">Onda: Sine</button>
  <button class="ctrl-btn" data-wave="triangle">Onda: Triangle</button>
  <button class="ctrl-btn" data-wave="square">Onda: Square</button>
</div>

<div class="piano" id="piano"></div>

<script>
const notes = [
  { note: 'C4', freq: 261.63, type: 'white', key: 'a' },
  { note: 'C#4', freq: 277.18, type: 'black', key: 'w' },
  { note: 'D4', freq: 293.66, type: 'white', key: 's' },
  { note: 'D#4', freq: 311.13, type: 'black', key: 'e' },
  { note: 'E4', freq: 329.63, type: 'white', key: 'd' },
  { note: 'F4', freq: 349.23, type: 'white', key: 'f' },
  { note: 'F#4', freq: 369.99, type: 'black', key: 't' },
  { note: 'G4', freq: 392.00, type: 'white', key: 'g' },
  { note: 'G#4', freq: 415.30, type: 'black', key: 'y' },
  { note: 'A4', freq: 440.00, type: 'white', key: 'h' },
  { note: 'A#4', freq: 466.16, type: 'black', key: 'u' },
  { note: 'B4', freq: 493.88, type: 'white', key: 'j' },
  { note: 'C5', freq: 523.25, type: 'white', key: 'k' }
];

const piano = document.getElementById('piano');
let actx = null;
let currentWave = 'sine';
const activeOsc = {};

function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
}

function noteOn(note, freq, el) {
  ensureAudio();
  if (activeOsc[note]) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = currentWave;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, actx.currentTime);
  g.gain.linearRampToValueAtTime(0.22, actx.currentTime + 0.03);
  o.connect(g); g.connect(actx.destination);
  o.start();
  activeOsc[note] = { o, g };
  if (el) el.classList.add('active');
}

function noteOff(note, el) {
  const active = activeOsc[note];
  if (!active) return;
  const { o, g } = active;
  g.gain.linearRampToValueAtTime(0, actx.currentTime + 0.12);
  o.stop(actx.currentTime + 0.14);
  delete activeOsc[note];
  if (el) el.classList.remove('active');
}

const keyToEl = {};

notes.forEach(n => {
  const el = document.createElement('div');
  el.className = `key ${n.type}`;
  el.dataset.note = n.note;
  el.innerHTML = `<span>${n.key.toUpperCase()}</span>`;
  el.addEventListener('pointerdown', e => { e.preventDefault(); noteOn(n.note, n.freq, el); });
  el.addEventListener('pointerup', () => noteOff(n.note, el));
  el.addEventListener('pointerleave', () => noteOff(n.note, el));
  keyToEl[n.key] = { el, note: n.note, freq: n.freq };
  piano.appendChild(el);
});

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = keyToEl[e.key.toLowerCase()];
  if (k) noteOn(k.note, k.freq, k.el);
});
document.addEventListener('keyup', e => {
  const k = keyToEl[e.key.toLowerCase()];
  if (k) noteOff(k.note, k.el);
});

document.querySelectorAll('.ctrl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentWave = btn.dataset.wave;
  });
});
</script>
</body>
</html>
