<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Space Mono',monospace;}

#stage{position:fixed;inset:0;}
#webgl{position:absolute;inset:0;display:block;}
#fx{position:absolute;inset:0;pointer-events:none;}

#loading{
  position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .8s ease;
}
#loading.hide{opacity:0;pointer-events:none;}
.load-ring{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,201,102,.18);border-top-color:#ffd9a0;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{color:rgba(255,217,160,.55);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;}

.back-link{position:fixed;top:14px;left:14px;font-size:12px;color:#ffe9c4;text-decoration:none;font-weight:700;background:rgba(255,201,102,.08);border:1px solid rgba(255,201,102,.32);padding:8px 14px;border-radius:20px;z-index:15;letter-spacing:.05em;backdrop-filter:blur(6px);transition:all .25s;}
.back-link:hover{background:rgba(255,201,102,.2);border-color:#ffd9a0;}

.sound-toggle{position:fixed;top:14px;right:14px;font-size:12px;color:#ffe9c4;background:rgba(255,201,102,.08);border:1px solid rgba(255,201,102,.32);padding:8px 14px;border-radius:20px;z-index:15;letter-spacing:.05em;backdrop-filter:blur(6px);cursor:pointer;font-family:'Space Mono',monospace;transition:all .25s;}
.sound-toggle:hover{background:rgba(255,201,102,.2);border-color:#ffd9a0;}

.hint{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:rgba(255,222,180,.4);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;z-index:12;text-align:center;
  pointer-events:none;transition:opacity 1.4s ease;
}

.signature{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:12;text-align:center;
  pointer-events:none;opacity:0;transition:opacity 2s ease;max-width:86vw;
}
.signature.show{opacity:1;}
.signature h2{
  color:#fff;font-size:clamp(16px,2.6vw,26px);font-weight:700;letter-spacing:.1em;
  text-shadow:0 0 22px rgba(255,201,102,.7), 0 0 50px rgba(255,201,102,.4);
}
.signature p{color:#ffd9a0;font-size:clamp(10px,1.2vw,13px);letter-spacing:.08em;margin-top:10px;opacity:.85;}

.wish-float{
  position:fixed;z-index:14;color:#ffe9c4;font-size:12px;letter-spacing:.04em;
  pointer-events:none;text-shadow:0 0 10px rgba(255,201,102,.7);
  animation:floatUp 2.4s ease forwards;white-space:nowrap;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.9);}
  15%{opacity:1;transform:translate(-50%,-10px) scale(1);}
  80%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-70px) scale(1);}
}

.counter{position:fixed;bottom:22px;right:16px;color:rgba(255,222,180,.4);font-size:10px;letter-spacing:.1em;z-index:12;text-align:right;}
.counter b{color:#ffd9a0;}
</style>
</head>
<body>
<a class="back-link" href="../index.html" onclick="if(window.history.length>1){history.back();return false;}">← Indietro</a>
<button class="sound-toggle" id="soundBtn">🔇 Suono</button>

<div id="loading"><div class="load-ring"></div><p>Accensione delle stelle...</p></div>

<div id="stage">
  <canvas id="webgl"></canvas>
  <canvas id="fx"></canvas>
</div>

<div class="hint" id="hint">trascina per esplorare · scorri per avvicinarti · clicca per lasciare un desiderio</div>
<div class="counter" id="counter">DESIDERI LASCIATI: <b id="wishCount">0</b></div>

<div class="signature" id="signature">
  <h2>UN UNIVERSO PERSONALE</h2>
  <p>COSTRUITO CON CURIOSITÀ, CODICE E UN PIZZICO DI INFINITO — DAVIDE</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const webglCanvas = document.getElementById('webgl');
  const fxCanvas = document.getElementById('fx');
  const loading = document.getElementById('loading');
  const hint = document.getElementById('hint');
  const signature = document.getElementById('signature');
  const soundBtn = document.getElementById('soundBtn');
  const wishCountEl = document.getElementById('wishCount');

  if (typeof THREE === 'undefined') {
    loading.innerHTML = '<p style="color:#ffb4b4">Impossibile caricare la scena 3D. Controlla la connessione e ricarica.</p>';
    return;
  }

  /* ---------------------------------------------------------------------
     SCENA THREE.JS
  --------------------------------------------------------------------- */
  let W = innerWidth, H = innerHeight;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 200);
  camera.position.set(4.2, 2.6, 4.6);

  const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: true, alpha: false });
  renderer.setClearColor(0x000000, 1);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.enableZoom = true;
  controls.minDistance = 2.2;
  controls.maxDistance = 18;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.target.set(0, 0, 0);

  /* ---------------- GALASSIA A SPIRALE ---------------- */
  const galaxyParams = {
    count: 22000,
    size: 0.028,
    radius: 6.2,
    branches: 5,
    spin: 1.3,
    randomness: 0.42,
    randomnessPower: 3,
    insideColor: new THREE.Color('#ffd9a0'),
    outsideColor: new THREE.Color('#3b6fd6')
  };

  const galaxyGeometry = new THREE.BufferGeometry();
  const positions = new Float32Array(galaxyParams.count * 3);
  const colors = new Float32Array(galaxyParams.count * 3);

  for (let i = 0; i < galaxyParams.count; i++) {
    const i3 = i * 3;
    const r = Math.random() * galaxyParams.radius;
    const branchAngle = ((i % galaxyParams.branches) / galaxyParams.branches) * Math.PI * 2;
    const spinAngle = r * galaxyParams.spin;

    const rx = Math.pow(Math.random(), galaxyParams.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * r;
    const ry = Math.pow(Math.random(), galaxyParams.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * r * 0.4;
    const rz = Math.pow(Math.random(), galaxyParams.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * r;

    positions[i3] = Math.cos(branchAngle + spinAngle) * r + rx;
    positions[i3 + 1] = ry;
    positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + rz;

    const mixed = galaxyParams.insideColor.clone();
    mixed.lerp(galaxyParams.outsideColor, r / galaxyParams.radius);
    colors[i3] = mixed.r;
    colors[i3 + 1] = mixed.g;
    colors[i3 + 2] = mixed.b;
  }

  galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const galaxyMaterial = new THREE.PointsMaterial({
    size: galaxyParams.size,
    sizeAttenuation: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
    transparent: true,
    opacity: 0.92
  });

  const galaxy = new THREE.Points(galaxyGeometry, galaxyMaterial);
  scene.add(galaxy);

  /* ---------------- CAMPO STELLARE DI SFONDO ---------------- */
  const farCount = 3200;
  const farGeometry = new THREE.BufferGeometry();
  const farPositions = new Float32Array(farCount * 3);
  for (let i = 0; i < farCount; i++) {
    const i3 = i * 3;
    const radius = 20 + Math.random() * 55;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    farPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
    farPositions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    farPositions[i3 + 2] = radius * Math.cos(phi);
  }
  farGeometry.setAttribute('position', new THREE.BufferAttribute(farPositions, 3));
  const farMaterial = new THREE.PointsMaterial({
    size: 0.045, sizeAttenuation: true, color: 0xffffff,
    transparent: true, opacity: 0.55, depthWrite: false
  });
  const farStars = new THREE.Points(farGeometry, farMaterial);
  scene.add(farStars);

  /* ---------------- NUCLEO CENTRALE LUMINOSO ---------------- */
  const coreGeo = new THREE.SphereGeometry(0.32, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffe6b8, transparent: true, opacity: 0.85 });
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);
  const glowGeo = new THREE.SphereGeometry(0.62, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffcf7d, transparent: true, opacity: 0.14 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glow);

  function onResize() {
    W = innerWidth; H = innerHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
    fxCanvas.width = W; fxCanvas.height = H;
  }
  addEventListener('resize', onResize);
  fxCanvas.width = W; fxCanvas.height = H;

  /* ---------------------------------------------------------------------
     STELLE CADENTI + DESIDERI (overlay 2D)
  --------------------------------------------------------------------- */
  const fxCtx = fxCanvas.getContext('2d');
  let shootingStars = [];

  const wishes = [
    "Un desiderio è volato tra le stelle...",
    "Le stelle ricordano ogni desiderio.",
    "Continua a esplorare, l'universo è infinito.",
    "Ogni click accende una nuova stella.",
    "Hai trovato un angolo di universo tutto tuo.",
    "Anche il buio ha bisogno di qualche luce.",
    "Chissà quante altre galassie non abbiamo ancora visto."
  ];

  function spawnShootingStar(x, y) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 6 + Math.random() * 4;
    shootingStars.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      trail: []
    });
  }

  function spawnWishText(x, y) {
    const el = document.createElement('div');
    el.className = 'wish-float';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.textContent = wishes[Math.floor(Math.random() * wishes.length)];
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  let wishCount = 0;
  let firstClick = true;

  function handleDiscoveryClick(x, y) {
    spawnShootingStar(x, y);
    spawnWishText(x, y);
    wishCount++;
    wishCountEl.textContent = wishCount;
    hint.style.opacity = '0';
    if (firstClick) {
      firstClick = false;
      setTimeout(() => signature.classList.add('show'), 900);
      startAmbient();
    }
  }

  let downX = 0, downY = 0;
  webglCanvas.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
  webglCanvas.addEventListener('pointerup', e => {
    const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
    if (dist < 6) handleDiscoveryClick(e.clientX, e.clientY);
  });

  function drawFx() {
    fxCtx.fillStyle = 'rgba(0,0,0,0.14)';
    fxCtx.globalCompositeOperation = 'destination-out';
    fxCtx.fillStyle = 'rgba(0,0,0,0.14)';
    fxCtx.fillRect(0, 0, W, H);
    fxCtx.globalCompositeOperation = 'lighter';

    shootingStars.forEach(s => {
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 16) s.trail.shift();
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.985; s.vy *= 0.985;
      s.life -= 0.012;

      for (let i = 0; i < s.trail.length - 1; i++) {
        const p = s.trail[i];
        const alpha = Math.max(s.life, 0) * (i / s.trail.length);
        fxCtx.strokeStyle = `rgba(255,217,160,${alpha})`;
        fxCtx.lineWidth = 1.6;
        fxCtx.beginPath();
        fxCtx.moveTo(p.x, p.y);
        fxCtx.lineTo(s.trail[i + 1].x, s.trail[i + 1].y);
        fxCtx.stroke();
      }
      fxCtx.fillStyle = `rgba(255,240,210,${Math.max(s.life, 0)})`;
      fxCtx.beginPath();
      fxCtx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      fxCtx.fill();
    });
    shootingStars = shootingStars.filter(s => s.life > 0);
    fxCtx.globalCompositeOperation = 'source-over';
  }

  /* ---------------------------------------------------------------------
     AUDIO AMBIENTALE SOFFUSO (sintetizzato, nessun file esterno)
  --------------------------------------------------------------------- */
  let actx = null, ambientNodes = [], soundOn = false, ambientStarted = false;

  function startAmbient() {
    if (ambientStarted) return;
    ambientStarted = true;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const masterGain = actx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(actx.destination);
      ambientNodes.masterGain = masterGain;

      const freqs = [110, 165, 220];
      freqs.forEach((f, i) => {
        const o = actx.createOscillator();
        o.type = 'sine';
        o.frequency.value = f;
        const g = actx.createGain();
        g.gain.value = 0.05 / (i + 1);
        const lfo = actx.createOscillator();
        lfo.frequency.value = 0.06 + i * 0.02;
        const lfoGain = actx.createGain();
        lfoGain.gain.value = 4;
        lfo.connect(lfoGain);
        lfoGain.connect(o.frequency);
        o.connect(g);
        g.connect(masterGain);
        o.start(); lfo.start();
      });
    } catch (e) { /* audio non disponibile */ }
  }

  soundBtn.addEventListener('click', () => {
    if (!ambientStarted) startAmbient();
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    soundOn = !soundOn;
    if (ambientNodes.masterGain) {
      ambientNodes.masterGain.gain.linearRampToValueAtTime(soundOn ? 1 : 0, actx.currentTime + 0.8);
    }
    soundBtn.textContent = soundOn ? '🔊 Suono' : '🔇 Suono';
  });

  /* ---------------------------------------------------------------------
     LOOP DI RENDER
  --------------------------------------------------------------------- */
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    galaxy.rotation.y += delta * 0.028;
    const pulse = 0.85 + Math.sin(clock.elapsedTime * 1.4) * 0.1;
    core.scale.setScalar(pulse);
    glow.scale.setScalar(pulse * 1.05);
    controls.update();
    renderer.render(scene, camera);
    drawFx();
  }

  onResize();
  loading.classList.add('hide');
  setTimeout(() => { hint.style.opacity = hint.style.opacity === '0' ? '0' : '1'; }, 50);
  setTimeout(() => { if (firstClick) hint.style.opacity = '0.4'; }, 300);
  animate();

  setTimeout(() => { if (firstClick) hint.style.opacity = '0'; }, 9000);
})();
</script>
</body>
</html>
