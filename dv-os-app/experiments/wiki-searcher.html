<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki Searcher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fira Sans',sans-serif;}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(92,107,192,.18), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(92,107,192,.14), transparent 45%),
    #eef0f5;
  padding:0 20px 60px;
}

.container{display:flex;flex-direction:column;justify-content:center;min-height:60vh;margin-top:20px;}
header{display:flex;flex-direction:column;align-items:center;animation:dropIn .6s cubic-bezier(.2,.8,.2,1);}
@keyframes dropIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}

.logo-mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#5c6bc0,#7986cb);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 10px 26px -8px rgba(92,107,192,.55);}
.logo-mark svg{width:28px;height:28px;}

h1{color:#3d3d45;font-size:38px;font-weight:700;letter-spacing:.01em;text-align:center;margin-bottom:6px;}
.subtitle{color:#8b8b96;font-size:14px;margin-bottom:22px;text-align:center;max-width:440px;}
header p{color:#5c6bc0;font-weight:600;font-size:13px;font-family:'Fira Code',monospace;letter-spacing:.03em;}

.search-box{display:flex;align-items:center;justify-content:center;border-radius:14px;width:100%;overflow:hidden;max-width:640px;margin-bottom:18px;transition:all .3s ease;background:#fff;box-shadow:0 4px 18px rgba(60,60,90,.08);position:relative;}
.search-box::before{content:'';position:absolute;left:18px;width:18px;height:18px;border:2px solid #b7bbd6;border-radius:50%;pointer-events:none;}
.search-box::after{content:'';position:absolute;left:31px;top:15px;width:8px;height:2px;background:#b7bbd6;border-radius:2px;transform:rotate(45deg);pointer-events:none;}
.search-box input{display:block;appearance:none;-webkit-appearance:none;outline:none;border:none;padding:17px 16px 17px 48px;border-radius:14px;width:100%;font-size:15.5px;transition:all .3s ease;background:transparent;}
.search-box:focus-within{box-shadow:0 10px 34px rgba(92,107,192,.22);transform:translateY(-3px);}

.results{max-width:760px;margin:0 auto;width:100%;}
.result{width:100%;padding:22px 24px;margin:14px 0;background-color:#fff;border-radius:16px;transition:all .3s ease;box-shadow:0 2px 10px rgba(60,60,90,.05);opacity:0;animation:riseIn .5s cubic-bezier(.2,.8,.2,1) forwards;border:1px solid rgba(92,107,192,.06);}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.result:hover{box-shadow:0 14px 32px -6px rgba(92,107,192,.22);transform:translateY(-3px);border-color:rgba(92,107,192,.18);}
.result h3{color:#3d3d45;font-size:24px;font-weight:600;margin-bottom:10px;}
.result p{color:#63636e;font-size:15.5px;line-height:1.55;margin-bottom:16px;}
.result p .searchmatch{background:rgba(92,107,192,.15);color:#3949ab;border-radius:3px;padding:0 2px;font-weight:600;}
.result a{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px;width:100%;background-color:#5c6bc0;color:#fff;text-decoration:none;text-align:center;font-weight:600;font-size:14px;border-radius:10px;transition:all .25s ease;}
.result a:hover{background-color:#3949ab;transform:translateY(-1px);}

.empty-state, .loading-state{text-align:center;color:#a2a2ae;margin-top:40px;font-size:14.5px;}
.loading-state .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5c6bc0;margin:0 3px;animation:bounce 1s infinite ease-in-out;}
.loading-state .dot:nth-child(2){animation-delay:.15s;}
.loading-state .dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5;}40%{transform:scale(1);opacity:1;}}

.back-link{position:fixed;top:14px;left:14px;font-size:13px;color:#616161;text-decoration:none;font-weight:600;background:#fff;padding:9px 15px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:all .25s;z-index:5;}
.back-link:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.12);}
</style>
</head>
<body>
<a class="back-link" href="../index.html" onclick="if(window.history.length>1){history.back();return false;}">← Indietro</a>
<div class="container">
  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 3a8 8 0 105.3 14.0L21 21" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    </div>
    <h1>Wiki Searcher</h1>
    <p class="subtitle">Cerca qualsiasi cosa direttamente su Wikipedia, in tempo reale.</p>
    <form class="search-box">
      <input type="search" placeholder="Cosa vuoi cercare?" autofocus>
    </form>
    <p id="counter">Results Count : 0</p>
  </header>
  <div class="results" id="results"></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.querySelector('.search-box');
  const input = form.querySelector('input[type="search"]');
  const resultsContainer = document.getElementById('results');
  const resultsCounter = document.getElementById('counter');

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    const searchTerm = input.value.trim();
    if (searchTerm) searchWikipedia(searchTerm);
  });

  function showLoading() {
    resultsContainer.innerHTML = `<div class="loading-state">Ricerca in corso <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  }

  function searchWikipedia(searchTerm) {
    showLoading();
    const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&prop=info&inprop=url&utf8=&format=json&origin=*&srlimit=500&srsearch=${encodeURIComponent(searchTerm)}`;
    fetch(url).then(r => r.json()).then(data => displayResults(data.query.search)).catch(err => {
      resultsContainer.innerHTML = `<div class="empty-state">Si è verificato un errore: ${err}</div>`;
    });
  }

  function displayResults(results) {
    resultsContainer.innerHTML = '';
    resultsCounter.textContent = `Results Count : ${results.length}`;
    if (!results.length) {
      resultsContainer.innerHTML = `<div class="empty-state">Nessun risultato trovato. Prova un altro termine.</div>`;
      return;
    }
    results.forEach((result, i) => {
      const el = document.createElement('div');
      el.className = 'result';
      el.style.animationDelay = `${Math.min(i, 8) * 0.05}s`;
      el.innerHTML = `<h3>${result.title}</h3><p>${result.snippet}</p><a href="https://en.wikipedia.org/?curid=${result.pageid}" target="_blank">Leggi di più →</a>`;
      resultsContainer.appendChild(el);
    });
  }
});
</script>
</body>
</html>
