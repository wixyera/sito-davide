<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
<title>Palette Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Fira+Code:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Sora',sans-serif;}

body{
  min-height:100vh;display:flex;flex-direction:column;
  background:#0f0e17;padding:0;
}

.top-bar{
  display:flex;align-items:center;justify-content:space-between;padding:20px 5vw;
  z-index:5;position:relative;
}
h1{color:#fff;font-weight:700;font-size:1.2rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px;}
h1 .ic{font-size:1.3rem;}
.hint-text{color:rgba(255,255,255,.55);font-size:.78rem;font-family:'Fira Code',monospace;}

.palette{
  flex:1;display:flex;min-height:0;
}
.swatch{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:34px;cursor:pointer;transition:flex .35s cubic-bezier(.2,.8,.2,1);
}
.swatch:hover{flex:1.15;}
.swatch.locked::before{
  content:'🔒';position:absolute;top:22px;left:50%;transform:translateX(-50%);
  font-size:18px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
}
.hex-pill{
  background:rgba(0,0,0,.28);backdrop-filter:blur(6px);color:#fff;font-family:'Fira Code',monospace;
  font-weight:700;font-size:.92rem;padding:9px 16px;border-radius:30px;letter-spacing:.03em;
  transition:transform .2s, background .2s;
}
.swatch:hover .hex-pill{transform:translateY(-3px);background:rgba(0,0,0,.4);}
.copied-msg{
  position:absolute;bottom:78px;left:50%;transform:translateX(-50%) translateY(6px);
  background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;font-family:'Fira Code',monospace;
  padding:5px 12px;border-radius:20px;opacity:0;transition:all .25s;pointer-events:none;
}
.copied-msg.show{opacity:1;transform:translateX(-50%) translateY(0);}
.lock-btn{
  position:absolute;top:20px;right:16px;background:rgba(0,0,0,.25);border:none;color:#fff;
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;
  align-items:center;justify-content:center;opacity:0;transition:opacity .2s, background .2s;
}
.swatch:hover .lock-btn{opacity:1;}
.lock-btn:hover{background:rgba(0,0,0,.4);}
.lock-btn.active{opacity:1;background:rgba(255,255,255,.25);}

.bottom-bar{
  display:flex;align-items:center;justify-content:center;gap:16px;padding:22px 5vw 30px;
  background:#0f0e17;
}
.generate-btn{
  background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:none;cursor:pointer;
  font-family:'Sora',sans-serif;font-weight:700;font-size:.95rem;padding:14px 32px;border-radius:14px;
  letter-spacing:.02em;transition:all .25s;box-shadow:0 10px 26px -8px rgba(139,92,246,.55);
}
.generate-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px -8px rgba(139,92,246,.65);}
.spacebar-hint{color:rgba(255,255,255,.4);font-size:.72rem;font-family:'Fira Code',monospace;}

.back-link{position:fixed;top:14px;left:14px;font-size:13px;color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.1);padding:9px 15px;border-radius:20px;transition:all .25s;backdrop-filter:blur(4px);z-index:20;}
.back-link:hover{background:rgba(255,255,255,.2);}

@media(max-width:700px){
  .palette{flex-direction:column;}
  .swatch{padding-bottom:0;padding-top:20px;justify-content:flex-start;}
  .lock-btn{opacity:1;top:12px;}
}
</style>
</head>
<body>
<a class="back-link" href="../index.html" onclick="if(window.history.length>1){history.back();return false;}">← Indietro</a>

<div class="top-bar">
  <h1><span class="ic">🎨</span>Palette Generator</h1>
  <div class="hint-text">clicca un colore per copiarlo · blocca quelli che ti piacciono</div>
</div>

<div class="palette" id="palette"></div>

<div class="bottom-bar">
  <button class="generate-btn" id="generateBtn">✨ Genera Nuova Palette</button>
  <div class="spacebar-hint">oppure premi [SPAZIO]</div>
</div>

<script>
const paletteEl = document.getElementById('palette');
const COUNT = 5;
let colors = [];
let locked = new Array(COUNT).fill(false);

function randomHsl() {
  const h = Math.floor(Math.random() * 360);
  const s = 55 + Math.floor(Math.random() * 35);
  const l = 42 + Math.floor(Math.random() * 30);
  return { h, s, l };
}

function hslToHex(h, s, l) {
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
}

function textColorFor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.58 ? '#1a1a1a' : '#ffffff';
}

function generate() {
  for (let i = 0; i < COUNT; i++) {
    if (!locked[i]) {
      const { h, s, l } = randomHsl();
      colors[i] = hslToHex(h, s, l);
    }
  }
  render();
}

function render() {
  paletteEl.innerHTML = '';
  colors.forEach((hex, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (locked[i] ? ' locked' : '');
    sw.style.background = hex;
    const txtColor = textColorFor(hex);

    sw.innerHTML = `
      <button class="lock-btn ${locked[i] ? 'active' : ''}" title="Blocca/sblocca">${locked[i] ? '🔒' : '🔓'}</button>
      <div class="copied-msg">Copiato!</div>
      <div class="hex-pill" style="color:${txtColor === '#ffffff' ? '#fff' : '#1a1a1a'}">${hex}</div>
    `;
    sw.style.color = txtColor;

    sw.querySelector('.lock-btn').addEventListener('click', e => {
      e.stopPropagation();
      locked[i] = !locked[i];
      render();
    });

    sw.addEventListener('click', () => {
      navigator.clipboard.writeText(hex);
      const msg = sw.querySelector('.copied-msg');
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 900);
    });

    paletteEl.appendChild(sw);
  });
}

document.getElementById('generateBtn').addEventListener('click', generate);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); generate(); }
});

// prima palette all'avvio
for (let i = 0; i < COUNT; i++) { const { h, s, l } = randomHsl(); colors.push(hslToHex(h, s, l)); }
render();
</script>
</body>
</html>
