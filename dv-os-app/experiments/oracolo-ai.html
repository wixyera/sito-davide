<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracolo IA — D.V. OS</title>
<style>
  :root{
    --bg:#0a0d0f;
    --panel:#10151700;
    --cyan:#00eeff;
    --cyan-soft:#6ff5ff;
    --text-dim:#8fa3a8;
    --white:#eafdff;
    --font-display:'Montserrat',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(0,238,255,.08), transparent 60%),
      var(--bg);
    color:var(--white);
    font-family:var(--font-body), system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 5vw 4vh;
  }
  .back{
    align-self:flex-start;
    color:var(--cyan-soft);
    text-decoration:none;
    font-size:.85rem;
    letter-spacing:.05em;
    margin-bottom:2rem;
    opacity:.8;
  }
  .back:hover{opacity:1;}
  h1{
    font-family:var(--font-display);
    font-weight:800;
    letter-spacing:.04em;
    font-size:clamp(1.6rem,4vw,2.4rem);
    margin:0 0 .3rem;
    text-shadow:0 0 20px rgba(0,238,255,.35);
  }
  .sub{color:var(--text-dim); margin:0 0 3rem; text-align:center; max-width:480px;}

  .orb-wrap{
    position:relative;
    width:180px; height:180px;
    margin-bottom:2.5rem;
    display:flex; align-items:center; justify-content:center;
  }
  .orb{
    width:120px; height:120px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eafdff, #6ff5ff 40%, #00b8c4 80%);
    box-shadow:0 0 40px rgba(0,238,255,.5), inset 0 0 30px rgba(255,255,255,.4);
    animation: pulse 3.2s ease-in-out infinite;
    transition: filter .3s ease;
  }
  .orb.thinking{
    animation: pulse-fast 0.9s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); filter:brightness(1); }
    50%{ transform:scale(1.04); filter:brightness(1.15); }
  }
  @keyframes pulse-fast{
    0%,100%{ transform:scale(1); filter:brightness(1) hue-rotate(0deg); }
    50%{ transform:scale(1.08); filter:brightness(1.3) hue-rotate(15deg); }
  }
  .ring{
    position:absolute; inset:0;
    border:1px solid rgba(110,245,255,.35);
    border-radius:50%;
    animation: spin 12s linear infinite;
  }
  .ring.r2{ inset:-18px; border-color:rgba(110,245,255,.15); animation-duration:20s; animation-direction:reverse;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .console{
    width:100%; max-width:520px;
    border:1px solid rgba(110,245,255,.25);
    border-radius:14px;
    padding:1.6rem;
    background:rgba(110,245,255,.03);
    backdrop-filter: blur(6px);
  }
  .risposta{
    min-height:70px;
    font-size:1.05rem;
    line-height:1.6;
    color:var(--cyan-soft);
    font-style:italic;
    margin-bottom:1.2rem;
    white-space:pre-wrap;
  }
  .risposta.error{ color:#ff8a8a; font-style:normal; }
  .risposta:empty::before{
    content:"Fai una domanda all'oracolo...";
    color:var(--text-dim);
    font-style:normal;
  }

  form{ display:flex; gap:.6rem; }
  input[type=text]{
    flex:1;
    background:#0c1113;
    border:1px solid rgba(110,245,255,.3);
    border-radius:8px;
    padding:.85rem 1rem;
    color:var(--white);
    font-family:var(--font-body);
    font-size:.95rem;
  }
  input[type=text]:focus{ outline:none; border-color:var(--cyan); }
  button{
    background:var(--cyan);
    color:#031012;
    border:none;
    border-radius:8px;
    padding:.85rem 1.3rem;
    font-weight:700;
    font-family:var(--font-display);
    letter-spacing:.03em;
    cursor:pointer;
    transition: filter .2s ease, transform .1s ease;
  }
  button:hover:not(:disabled){ filter:brightness(1.1); }
  button:active:not(:disabled){ transform:scale(.97); }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  .counter{
    text-align:right;
    font-size:.75rem;
    color:var(--text-dim);
    margin-top:.5rem;
  }
</style>
</head>
<body>

<a class="back" href="../index.html">← Torna al D.V. OS</a>

<h1>ORACOLO IA</h1>
<p class="sub">Fai una domanda. L'oracolo — alimentato da una vera intelligenza artificiale — ti risponderà a modo suo.</p>

<div class="orb-wrap">
  <div class="ring"></div>
  <div class="ring r2"></div>
  <div class="orb" id="orb"></div>
</div>

<div class="console">
  <div class="risposta" id="risposta"></div>
  <form id="form">
    <input type="text" id="domanda" placeholder="Cosa vuoi chiedere all'oracolo?" maxlength="500" autocomplete="off">
    <button type="submit" id="btn">Chiedi</button>
  </form>
  <div class="counter" id="counter"></div>
</div>

<script>
(function(){
  const form = document.getElementById('form');
  const input = document.getElementById('domanda');
  const btn = document.getElementById('btn');
  const risposta = document.getElementById('risposta');
  const orb = document.getElementById('orb');
  const counter = document.getElementById('counter');

  input.addEventListener('input', () => {
    counter.textContent = input.value.length + ' / 500';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const domanda = input.value.trim();
    if (!domanda) return;

    btn.disabled = true;
    input.disabled = true;
    orb.classList.add('thinking');
    risposta.classList.remove('error');
    risposta.textContent = 'L\'oracolo sta meditando...';

    try {
      const res = await fetch('/api/oracolo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domanda })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Errore sconosciuto.');
      }
      risposta.textContent = data.risposta;
    } catch (err) {
      risposta.classList.add('error');
      risposta.textContent = 'Errore: ' + err.message;
    } finally {
      btn.disabled = false;
      input.disabled = false;
      orb.classList.remove('thinking');
    }
  });
})();
</script>

</body>
</html>
