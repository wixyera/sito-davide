<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#020103;font-family:'Space Mono',monospace;}
canvas{display:block;position:fixed;inset:0;cursor:crosshair;}

.back-link{position:fixed;top:14px;left:14px;font-size:12px;color:#c4b5fd;text-decoration:none;font-weight:700;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.35);padding:8px 14px;border-radius:20px;z-index:10;letter-spacing:.05em;backdrop-filter:blur(6px);transition:all .25s;}
.back-link:hover{background:rgba(139,92,246,.25);border-color:#e879f9;}

.hud{position:fixed;top:14px;right:14px;color:rgba(196,181,253,.55);font-size:11px;letter-spacing:.08em;z-index:10;text-align:right;line-height:1.7;}
.hud b{color:#f0abfc;}

.hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(196,181,253,.4);font-size:11px;letter-spacing:.1em;text-transform:uppercase;z-index:10;text-align:center;pointer-events:none;transition:opacity 1s;}

.msg{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  color:#fff; font-size:clamp(18px,3.4vw,34px); font-weight:700; letter-spacing:.07em;
  text-align:center; opacity:0; pointer-events:none; z-index:9; max-width:80vw;
  text-shadow:0 0 24px rgba(240,171,252,.8), 0 0 60px rgba(139,92,246,.6);
  transition:opacity 1.6s ease;
}
.msg.show{opacity:1;}
.msg span{display:block;font-size:.4em;color:#93c5fd;letter-spacing:.2em;margin-top:12px;font-weight:400;}
</style>
</head>
<body>
<a class="back-link" href="../index.html" onclick="if(window.history.length>1){history.back();return false;}">← Indietro</a>
<div class="hud">POZZI ATTIVI: <b id="wCount">1</b><br>MASSA TOTALE: <b id="mTotal">0</b></div>
<canvas id="c"></canvas>
<div class="msg" id="msg">SEI ARRIVATO FIN QUI<span>continua a cliccare, le orbite non si stancano mai</span></div>
<div class="hint" id="hint">clicca per creare un pozzo gravitazionale • tienilo premuto per uno più massiccio</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const hues = [265, 285, 200, 320, 190];
const wCountEl = document.getElementById('wCount');
const mTotalEl = document.getElementById('mTotal');
const hintEl = document.getElementById('hint');
const msgEl = document.getElementById('msg');

class Well {
  constructor(x, y, mass) {
    this.x = x; this.y = y; this.mass = mass;
    this.hue = hues[Math.floor(Math.random() * hues.length)];
    this.born = performance.now();
  }
  draw() {
    const r = 4 + this.mass * 0.9;
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 5);
    g.addColorStop(0, `hsla(${this.hue},95%,75%,.9)`);
    g.addColorStop(0.35, `hsla(${this.hue},90%,60%,.35)`);
    g.addColorStop(1, `hsla(${this.hue},90%,50%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `hsl(${this.hue},95%,85%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Particle {
  constructor() { this.reset(); }
  reset() {
    const edge = Math.floor(Math.random() * 4);
    if (edge === 0) { this.x = Math.random() * W; this.y = -10; }
    else if (edge === 1) { this.x = W + 10; this.y = Math.random() * H; }
    else if (edge === 2) { this.x = Math.random() * W; this.y = H + 10; }
    else { this.x = -10; this.y = Math.random() * H; }
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = (Math.random() - 0.5) * 1.2;
    this.hue = hues[Math.floor(Math.random() * hues.length)];
    this.trail = [];
  }
  update() {
    wells.forEach(w => {
      const dx = w.x - this.x, dy = w.y - this.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq) || 1;
      const force = (w.mass * 12) / Math.max(distSq, 400);
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;
      if (dist < 6 + w.mass * 0.6) { this.reset(); }
    });
    this.vx *= 0.998; this.vy *= 0.998;
    this.x += this.vx; this.y += this.vy;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 14) this.trail.shift();
    if (this.x < -60 || this.x > W + 60 || this.y < -60 || this.y > H + 60) this.reset();
  }
  draw() {
    for (let i = 0; i < this.trail.length - 1; i++) {
      const p = this.trail[i], p2 = this.trail[i + 1];
      ctx.strokeStyle = `hsla(${this.hue},90%,70%,${(i / this.trail.length) * 0.5})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
  }
}

let wells = [new Well(innerWidth / 2, innerHeight / 2, 10)];
let particles = Array.from({ length: 220 }, () => new Particle());
let idle = 0;
let pressStart = 0;
let pressPos = null;
let msgShown = false;

function updateHud() {
  wCountEl.textContent = wells.length;
  mTotalEl.textContent = wells.reduce((s, w) => s + w.mass, 0).toFixed(0);
}
updateHud();

canvas.addEventListener('mousedown', e => { pressStart = performance.now(); pressPos = { x: e.clientX, y: e.clientY }; resetIdle(); });
canvas.addEventListener('mouseup', e => {
  if (!pressPos) return;
  const held = performance.now() - pressStart;
  const mass = Math.min(10 + held / 40, 60);
  wells.push(new Well(pressPos.x, pressPos.y, mass));
  if (wells.length > 6) wells.shift();
  pressPos = null;
  updateHud();
});
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  pressStart = performance.now(); pressPos = { x: t.clientX, y: t.clientY };
  resetIdle();
}, { passive: true });
canvas.addEventListener('touchend', () => {
  if (!pressPos) return;
  const held = performance.now() - pressStart;
  const mass = Math.min(10 + held / 40, 60);
  wells.push(new Well(pressPos.x, pressPos.y, mass));
  if (wells.length > 6) wells.shift();
  pressPos = null;
  updateHud();
});

function resetIdle() {
  idle = 0;
  if (msgShown) { msgEl.classList.remove('show'); msgShown = false; }
}

function loop() {
  ctx.fillStyle = 'rgba(2,1,3,0.16)';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  wells.forEach(w => w.draw());
  particles.forEach(p => { p.update(); p.draw(); });
  ctx.globalCompositeOperation = 'source-over';

  idle++;
  if (idle === 60 * 8) hintEl.style.opacity = '0';
  if (idle === 60 * 16 && !msgShown) { msgEl.classList.add('show'); msgShown = true; }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
