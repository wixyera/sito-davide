<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
<title>Pass Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fira+Code:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,#2e7d32,#43A047 55%,#66bb6a);
  padding:24px;
}

.container{
  width:450px;max-width:100%;background:#fff;border-radius:18px;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.35);
  overflow:hidden;
  animation:pop .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

.container h2{
  font-weight:700;font-size:1.28rem;padding:1.15rem 1.75rem;
  border-bottom:1px solid #eef1f5;display:flex;align-items:center;gap:10px;color:#2e2e33;
}
.container h2 .ic{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#43A047,#2e7d32);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}

.wrapper{margin:1.4rem 1.75rem 1.6rem;}
.wrapper .input-box{position:relative;}
.input-box input{
  width:100%;height:56px;color:#1c1c22;background:#f6f8fa;font-size:1.12rem;font-weight:600;
  border-radius:10px;letter-spacing:1.4px;border:1.5px solid transparent;padding:0 3rem 0 1.1rem;
  font-family:'Fira Code',monospace;transition:all .25s;
}
.input-box input:focus{outline:none;border-color:#43A047;background:#fff;}
.input-box span{position:absolute;right:14px;cursor:pointer;line-height:56px;color:#8a8a94;transition:color .2s,transform .2s;}
.input-box span:hover{color:#43A047 !important;transform:scale(1.12);}

.wrapper .pass-indicator{width:100%;height:6px;position:relative;margin-top:.85rem;border-radius:25px;background:#eceef2;overflow:hidden;}
.pass-indicator::before{position:absolute;content:"";height:100%;width:50%;border-radius:inherit;transition:width .35s ease,background .35s ease;}
.pass-indicator#weak::before{width:20%;background:linear-gradient(90deg,#e64a4a,#ff7a7a);}
.pass-indicator#medium::before{width:50%;background:linear-gradient(90deg,#f1c80b,#ffe066);}
.pass-indicator#strong::before{width:100%;background:linear-gradient(90deg,#2e7d32,#43A047);}

.wrapper .pass-length{margin:1.7rem 0 1.3rem;}
.pass-length .details{display:flex;justify-content:space-between;font-size:.92rem;}
.pass-length .details span{font-family:'Fira Code',monospace;font-weight:700;color:#2e7d32;background:#eaf6eb;padding:2px 10px;border-radius:8px;}
.pass-length input{width:100%;height:6px;-webkit-appearance:none;appearance:none;border-radius:6px;background:linear-gradient(90deg,#43A047 var(--val,50%),#e6e9ee var(--val,50%));margin-top:.7rem;cursor:pointer;}
.pass-length input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #43A047;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;transition:transform .2s;}
.pass-length input::-webkit-slider-thumb:hover{transform:scale(1.15);}
.pass-length input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #43A047;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;}

.pass-settings .title{font-weight:600;color:#2e2e33;font-size:.95rem;}
.pass-settings .options{display:flex;list-style:none;flex-wrap:wrap;margin-top:1rem;gap:2px 0;}
.pass-settings .options .option{display:flex;align-items:center;margin-bottom:.9rem;width:calc(100% / 2);}
.options .option:first-child{pointer-events:none;}
.options .option:first-child input{opacity:.7;}
.options .option input{height:17px;width:17px;cursor:pointer;accent-color:#43A047;}
.options .option label{cursor:pointer;color:#54545e;padding-left:.63rem;font-size:.93rem;}

.wrapper .generate-btn{
  width:100%;color:#fff;border:none;outline:none;cursor:pointer;
  background:linear-gradient(135deg,#43A047,#2e7d32);font-size:1.02rem;font-weight:600;
  padding:1rem 0;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;
  margin:1.1rem 0 .3rem;transition:all .25s;box-shadow:0 10px 24px -8px rgba(67,160,71,.55);
}
.wrapper .generate-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -8px rgba(67,160,71,.65);}
.wrapper .generate-btn:active{transform:translateY(0);}

.back-link{position:fixed;top:14px;left:14px;font-size:13px;color:#fff;text-decoration:none;font-weight:600;background:rgba(0,0,0,.2);padding:9px 15px;border-radius:20px;transition:all .25s;backdrop-filter:blur(4px);}
.back-link:hover{background:rgba(0,0,0,.32);}
</style>
</head>
<body>
<a class="back-link" href="../index.html" onclick="if(window.history.length>1){history.back();return false;}">← Indietro</a>
<div class="container">
  <h2><span class="ic">🔒</span>Pass Generator</h2>
  <div class="wrapper">
    <div class="input-box">
      <input type="text" disabled>
      <span class="material-symbols-rounded">copy_all</span>
    </div>
    <div class="pass-indicator"></div>
    <div class="pass-length">
      <div class="details">
        <label class="title">Password Length</label>
        <span></span>
      </div>
      <input type="range" min="1" max="30" value="15" step="1">
    </div>
    <div class="pass-settings">
      <label class="title">Pass Settings</label>
      <ul class="options">
        <li class="option"><input type="checkbox" id="lowercase" checked><label for="lowercase">Lowercase (a-z)</label></li>
        <li class="option"><input type="checkbox" id="uppercase"><label for="uppercase">Uppercase (A-Z)</label></li>
        <li class="option"><input type="checkbox" id="numbers"><label for="numbers">Numbers (0-9)</label></li>
        <li class="option"><input type="checkbox" id="symbols"><label for="symbols">Symbols (!-$^+)</label></li>
        <li class="option"><input type="checkbox" id="exc-duplicate"><label for="exc-duplicate">Exclude Duplicate</label></li>
        <li class="option"><input type="checkbox" id="spaces"><label for="spaces">Include Spaces</label></li>
      </ul>
    </div>
    <button class="generate-btn">Generate Password</button>
  </div>
</div>
<script>
const lengthSlider = document.querySelector(".pass-length input");
const options = document.querySelectorAll(".option input");
const copyIcon = document.querySelector(".input-box span");
const passwordInput = document.querySelector(".input-box input");
const passIndicator = document.querySelector(".pass-indicator");
const generateBtn = document.querySelector(".generate-btn");

const characters = {
  lowercase: "abcdefghijklmnopqrstuvwxyz",
  uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  numbers: "0123456789",
  symbols: "!$%&|[](){}:;.,*+-#@<>~"
};

const generatePassword = () => {
  let staticPassword = "", randomPassword = "", excludeDuplicate = false, passLength = lengthSlider.value;
  options.forEach(option => {
    if (option.checked) {
      if (option.id !== "exc-duplicate" && option.id !== "spaces") {
        staticPassword += characters[option.id];
      } else if (option.id === "spaces") {
        staticPassword += `  ${staticPassword}  `;
      } else {
        excludeDuplicate = true;
      }
    }
  });
  for (let i = 0; i < passLength; i++) {
    let randomChar = staticPassword[Math.floor(Math.random() * staticPassword.length)];
    if (excludeDuplicate) {
      !randomPassword.includes(randomChar) || randomChar == " " ? randomPassword += randomChar : i--;
    } else {
      randomPassword += randomChar;
    }
  }
  passwordInput.value = randomPassword;
};

const updatePassIndicator = () => {
  passIndicator.id = lengthSlider.value <= 8 ? "weak" : lengthSlider.value <= 16 ? "medium" : "strong";
};

const updateSliderTrack = () => {
  const pct = ((lengthSlider.value - lengthSlider.min) / (lengthSlider.max - lengthSlider.min)) * 100;
  lengthSlider.style.setProperty('--val', pct + '%');
};

const updateSlider = () => {
  document.querySelector(".pass-length span").innerText = lengthSlider.value;
  generatePassword();
  updatePassIndicator();
  updateSliderTrack();
};
updateSlider();

const copyPassword = () => {
  navigator.clipboard.writeText(passwordInput.value);
  copyIcon.innerText = "check";
  copyIcon.style.color = "#43A047";
  setTimeout(() => {
    copyIcon.innerText = "copy_all";
    copyIcon.style.color = "#707070";
  }, 1500);
};

copyIcon.addEventListener("click", copyPassword);
lengthSlider.addEventListener("input", updateSlider);
generateBtn.addEventListener("click", generatePassword);
</script>
</body>
</html>
