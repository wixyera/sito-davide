<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Meteo Radar HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1e2d; --bg2:#12283a;
    --cyan:#ff6b4a; --cyan2:#ffb347; --cyan3:#2dd4bf;
    --cyan-dim:#7a3325; --cyan-glow:rgba(255,107,74,0.5);
    --amber:#ffd166; --red:#ff5d5d; --white:#fdf6ec; --text-dim:#a89685;
    --line:rgba(255,107,74,0.22);
    --font-display:'Fredoka', sans-serif; --font-body:'Nunito', sans-serif; --font-mono:'Space Mono', monospace;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg) 60%); color:var(--white); font-family:var(--font-body); font-weight:500; min-height:100vh; padding:90px 5vw 60px; position:relative; overflow-x:hidden;}
  a{color:inherit;} button{font-family:inherit;}
  ::selection{background:var(--cyan); color:#fff;}

  .bg-radar{position:fixed; top:-30vw; right:-30vw; width:80vw; height:80vw; z-index:0; pointer-events:none; border-radius:50%; opacity:.14; background:conic-gradient(from 0deg, var(--cyan) 0deg, var(--cyan2) 120deg, transparent 240deg, transparent 360deg); animation:radarspin 6s linear infinite;}
  @keyframes radarspin{to{transform:rotate(360deg);}}
  .bg-grid{position:fixed; inset:0; z-index:0; pointer-events:none; background-image:linear-gradient(rgba(255,107,74,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,107,74,0.06) 1px, transparent 1px); background-size:52px 52px; mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, black 30%, transparent 85%);}

  .back-link{position:fixed; top:14px; left:14px; font-size:12px; color:var(--cyan2); text-decoration:none; font-weight:700; background:rgba(255,179,71,.1); border:1px solid rgba(255,179,71,.4); padding:9px 15px; border-radius:20px; z-index:50; letter-spacing:.05em; backdrop-filter:blur(6px); transition:all .25s; font-family:var(--font-mono); display:inline-flex; align-items:center; gap:6px;}
  .back-link:hover{background:rgba(255,179,71,.22); border-color:var(--cyan2);}

  header.page-head{position:relative; z-index:2; text-align:center; max-width:640px; margin:0 auto 2rem;}
  .eyebrow{font-family:var(--font-mono); font-size:.7rem; color:var(--cyan2); letter-spacing:.25em; text-transform:uppercase; margin-bottom:.8rem; display:flex; align-items:center; justify-content:center; gap:10px;}
  .eyebrow::before{content:'['; color:var(--text-dim);}
  .eyebrow::after{content:']'; color:var(--text-dim);}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(1.8rem,5vw,2.6rem); background:linear-gradient(90deg,var(--white),var(--cyan2) 120%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  header.page-head p{color:var(--text-dim); margin-top:.8rem; font-size:.95rem; line-height:1.5;}

  main{position:relative; z-index:2; max-width:820px; margin:0 auto;}

  /* ---- ricerca città ---- */
  .search-row{display:flex; gap:10px; max-width:440px; margin:0 auto 2.2rem;}
  .search-row input{flex:1; background:rgba(255,107,74,.06); border:1px solid var(--line); color:var(--white); padding:12px 16px; font-family:var(--font-body); font-size:1rem; border-radius:24px; transition:border-color .25s, box-shadow .25s;}
  .search-row input:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(255,107,74,.15);}
  .search-row button{background:linear-gradient(120deg,var(--cyan),var(--cyan2)); color:#0f2431; border:none; padding:12px 22px; font-family:var(--font-mono); font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; cursor:pointer; border-radius:24px; box-shadow:0 4px 20px -6px var(--cyan-glow); transition:all .25s; white-space:nowrap;}
  .search-row button:hover{transform:translateY(-2px); box-shadow:0 8px 26px -4px rgba(255,107,74,.8);}
  .suggest-list{max-width:440px; margin:-1.6rem auto 1.6rem; background:var(--bg2); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:none;}
  .suggest-list.show{display:block;}
  .suggest-item{padding:11px 16px; font-size:.85rem; cursor:pointer; border-bottom:1px solid var(--line); transition:background .2s;}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover{background:rgba(255,107,74,.12);}
  .suggest-item small{display:block; color:var(--text-dim); font-family:var(--font-mono); font-size:.65rem; margin-top:2px;}

  /* ---- radar centrale ---- */
  .radar-wrap{position:relative; width:min(280px,72vw); height:min(280px,72vw); margin:0 auto 1.6rem; display:flex; align-items:center; justify-content:center;}
  .radar-ring{position:absolute; border-radius:50%; border:1px solid rgba(255,107,74,.25);}
  .radar-ring.r1{inset:0;} .radar-ring.r2{inset:14%;} .radar-ring.r3{inset:28%;}
  .radar-sweep{position:absolute; inset:0; border-radius:50%; overflow:hidden; opacity:.55;}
  .radar-sweep::before{content:''; position:absolute; inset:0; background:conic-gradient(from 0deg, var(--cyan) 0deg, transparent 55deg, transparent 360deg); animation:radarspin 3.2s linear infinite;}
  .radar-core{position:relative; z-index:2; width:70%; height:70%; border-radius:50%; background:radial-gradient(circle at 40% 35%, rgba(255,179,71,.28), rgba(255,107,74,.08) 70%); border:1px solid var(--cyan); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 0 60px -6px var(--cyan-glow), inset 0 0 34px rgba(255,107,74,.2); text-align:center; padding:10px;}
  .radar-icon{font-size:2.6rem; line-height:1; filter:drop-shadow(0 0 10px rgba(255,179,71,.5));}
  .radar-temp{font-family:var(--font-display); font-weight:700; font-size:clamp(2.2rem,8vw,3rem); margin-top:4px; background:linear-gradient(90deg,var(--white),var(--cyan2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .radar-desc{font-family:var(--font-mono); font-size:.7rem; color:var(--cyan2); letter-spacing:.08em; text-transform:uppercase; margin-top:2px;}

  .city-name{text-align:center; font-family:var(--font-display); font-size:1.3rem; color:var(--white); margin-bottom:.3rem;}
  .city-sub{text-align:center; font-family:var(--font-mono); font-size:.68rem; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:1.6rem;}

  .stat-strip{display:flex; justify-content:center; gap:2.2rem; flex-wrap:wrap; margin-bottom:2.4rem;}
  .stat-item{text-align:center; font-family:var(--font-mono);}
  .stat-item .si-val{font-size:1.1rem; color:var(--white); font-weight:700;}
  .stat-item .si-label{font-size:.6rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}

  /* ---- previsioni ---- */
  .forecast-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:10px;}
  .fc-card{background:linear-gradient(160deg,rgba(20,60,70,.4),rgba(10,28,38,.5)); border:1px solid var(--line); border-radius:10px; padding:14px 8px; text-align:center; transition:transform .3s, border-color .3s, box-shadow .3s;}
  .fc-card:hover{transform:translateY(-4px); border-color:var(--cyan); box-shadow:0 14px 30px -14px var(--cyan-glow);}
  .fc-day{font-family:var(--font-mono); font-size:.62rem; color:var(--cyan2); text-transform:uppercase; letter-spacing:.06em;}
  .fc-icon{font-size:1.5rem; margin:8px 0 6px;}
  .fc-max{font-family:var(--font-mono); font-size:.86rem; color:var(--white); font-weight:700;}
  .fc-min{font-family:var(--font-mono); font-size:.7rem; color:var(--text-dim);}

  .loading, .error-box{font-family:var(--font-mono); font-size:.8rem; color:var(--text-dim); text-align:center; padding:50px 10px;}
  .loading .spin{width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,107,74,.2); border-top-color:var(--cyan2); margin:0 auto 16px; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{color:var(--red);}

  footer.page-foot{position:relative; z-index:2; text-align:center; margin-top:3rem; font-family:var(--font-mono); font-size:.62rem; color:var(--text-dim); letter-spacing:.06em;}
  footer.page-foot a{color:var(--cyan2); text-decoration:none;}

  @media(max-width:700px){
    body{padding:80px 5vw 50px;}
    .forecast-strip{grid-template-columns:repeat(3,1fr);}
    .stat-strip{gap:1.4rem;}
    .search-row{flex-direction:column;}
    .suggest-list{margin-top:-1rem;}
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-radar"></div>
<a class="back-link" href="../index.html">← Torna alla home</a>

<header class="page-head">
  <span class="eyebrow">Esperimento 23</span>
  <h1>🛰️ Meteo Radar</h1>
  <p>Cerca una città e leggi meteo attuale e previsioni a 6 giorni, in stile HUD.</p>
</header>

<main>
  <div style="position:relative;">
    <div class="search-row">
      <input type="text" id="citySearch" placeholder="Cerca una città… (es. Bologna)" autocomplete="off">
      <button id="searchBtn">Cerca</button>
    </div>
    <div class="suggest-list" id="suggestList"></div>
  </div>

  <div id="weatherBox">
    <div class="loading"><div class="spin"></div>Localizzo la città…</div>
  </div>
</main>

<footer class="page-foot">
  DATI FORNITI DA OPEN-METEO.COM · NESSUNA CHIAVE API RICHIESTA<br>
  <a href="../index.html">Pogue HQ — Personal OS</a>
</footer>

<script>
(function(){
  "use strict";

  const GEOCODE_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";
  const DEFAULT_CITY = "Roma";

  const weatherBox = document.getElementById('weatherBox');
  const cityInput = document.getElementById('citySearch');
  const searchBtn = document.getElementById('searchBtn');
  const suggestList = document.getElementById('suggestList');

  const WCODE = {
    0:['☀️','Sereno'], 1:['🌤️','Prevalentemente sereno'], 2:['⛅','Parzialmente nuvoloso'], 3:['☁️','Coperto'],
    45:['🌫️','Nebbia'], 48:['🌫️','Nebbia con brina'],
    51:['🌦️','Pioggerella leggera'], 53:['🌦️','Pioggerella moderata'], 55:['🌧️','Pioggerella intensa'],
    56:['🌧️','Pioggerella gelata'], 57:['🌧️','Pioggerella gelata forte'],
    61:['🌧️','Pioggia debole'], 63:['🌧️','Pioggia moderata'], 65:['🌧️','Pioggia forte'],
    66:['🌧️','Pioggia gelata'], 67:['🌧️','Pioggia gelata forte'],
    71:['🌨️','Neve debole'], 73:['🌨️','Neve moderata'], 75:['❄️','Neve forte'], 77:['🌨️','Granelli di neve'],
    80:['🌦️','Rovesci deboli'], 81:['🌧️','Rovesci moderati'], 82:['⛈️','Rovesci violenti'],
    85:['🌨️','Rovesci di neve deboli'], 86:['❄️','Rovesci di neve forti'],
    95:['⛈️','Temporale'], 96:['⛈️','Temporale con grandine'], 99:['⛈️','Temporale con grandine forte']
  };
  function wInfo(code){ return WCODE[code] || ['🌡️','Condizioni sconosciute']; }

  const DOW = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

  function debounce(fn, ms){
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  async function geocode(name){
    const url = `${GEOCODE_URL}?name=${encodeURIComponent(name)}&count=6&language=it&format=json`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('geocode HTTP ' + res.status);
    const data = await res.json();
    return data.results || [];
  }

  async function loadWeatherFor(place){
    weatherBox.innerHTML = '<div class="loading"><div class="spin"></div>Ricevo i dati meteo…</div>';
    suggestList.classList.remove('show');
    try{
      const params = new URLSearchParams({
        latitude: place.latitude, longitude: place.longitude,
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min',
        timezone: 'auto', forecast_days: 6
      });
      const res = await fetch(`${FORECAST_URL}?${params.toString()}`);
      if (!res.ok) throw new Error('forecast HTTP ' + res.status);
      const data = await res.json();
      renderWeather(place, data);
    }catch(err){
      weatherBox.innerHTML = `<div class="error-box">Non riesco a leggere il meteo in questo momento.<br>Riprova tra poco.</div>`;
    }
  }

  function renderWeather(place, data){
    const cur = data.current || {};
    const [icon, desc] = wInfo(cur.weather_code);
    const region = [place.admin1, place.country].filter(Boolean).join(', ');

    let forecastHtml = '';
    const daily = data.daily || {};
    (daily.time || []).forEach((dateStr, i) => {
      const d = new Date(dateStr + 'T12:00:00');
      const label = i === 0 ? 'Oggi' : DOW[d.getDay()];
      const [fIcon] = wInfo(daily.weather_code[i]);
      forecastHtml += `<div class="fc-card">
        <div class="fc-day">${label}</div>
        <div class="fc-icon">${fIcon}</div>
        <div class="fc-max">${Math.round(daily.temperature_2m_max[i])}°</div>
        <div class="fc-min">${Math.round(daily.temperature_2m_min[i])}°</div>
      </div>`;
    });

    weatherBox.innerHTML = `
      <div class="city-name">${place.name}</div>
      <div class="city-sub">${region || 'Posizione trovata'}</div>

      <div class="radar-wrap">
        <div class="radar-ring r1"></div>
        <div class="radar-ring r2"></div>
        <div class="radar-ring r3"></div>
        <div class="radar-sweep"></div>
        <div class="radar-core">
          <div class="radar-icon">${icon}</div>
          <div class="radar-temp">${Math.round(cur.temperature_2m)}°</div>
          <div class="radar-desc">${desc}</div>
        </div>
      </div>

      <div class="stat-strip">
        <div class="stat-item"><div class="si-val">${Math.round(cur.apparent_temperature)}°</div><div class="si-label">Percepita</div></div>
        <div class="stat-item"><div class="si-val">${cur.relative_humidity_2m}%</div><div class="si-label">Umidità</div></div>
        <div class="stat-item"><div class="si-val">${Math.round(cur.wind_speed_10m)} km/h</div><div class="si-label">Vento</div></div>
      </div>

      <div class="forecast-strip">${forecastHtml}</div>
    `;
  }

  async function searchAndLoad(query){
    if (!query || !query.trim()) return;
    weatherBox.innerHTML = '<div class="loading"><div class="spin"></div>Cerco la città…</div>';
    try{
      const results = await geocode(query.trim());
      if (!results.length){
        weatherBox.innerHTML = `<div class="error-box">Nessuna città trovata per "${query}".</div>`;
        return;
      }
      loadWeatherFor(results[0]);
    }catch(err){
      weatherBox.innerHTML = `<div class="error-box">Errore nella ricerca della città. Riprova tra poco.</div>`;
    }
  }

  const showSuggestions = debounce(async (query) => {
    if (!query || query.trim().length < 2){ suggestList.classList.remove('show'); return; }
    try{
      const results = await geocode(query.trim());
      if (!results.length){ suggestList.classList.remove('show'); return; }
      suggestList.innerHTML = results.map(r => {
        const region = [r.admin1, r.country].filter(Boolean).join(', ');
        return `<div class="suggest-item" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.name}" data-admin1="${r.admin1 || ''}" data-country="${r.country || ''}">
          ${r.name}<small>${region}</small>
        </div>`;
      }).join('');
      suggestList.classList.add('show');
    }catch(e){ suggestList.classList.remove('show'); }
  }, 350);

  cityInput.addEventListener('input', e => showSuggestions(e.target.value));
  cityInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchAndLoad(cityInput.value); });
  searchBtn.addEventListener('click', () => searchAndLoad(cityInput.value));

  suggestList.addEventListener('click', e => {
    const item = e.target.closest('.suggest-item');
    if (!item) return;
    cityInput.value = item.dataset.name;
    loadWeatherFor({
      name: item.dataset.name, latitude: item.dataset.lat, longitude: item.dataset.lon,
      admin1: item.dataset.admin1, country: item.dataset.country
    });
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-row') && !e.target.closest('.suggest-list')) suggestList.classList.remove('show');
  });

  searchAndLoad(DEFAULT_CITY);
})();
</script>

</body>
</html>
