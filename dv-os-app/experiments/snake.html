<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#020a06;font-family:'Space Mono',monospace;overflow:hidden;}

body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.15) 3px);
  mix-blend-mode:multiply;
}

.wrap{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:1;}

.hud{display:flex;gap:26px;color:#6bffb0;font-size:.85rem;letter-spacing:.08em;text-shadow:0 0 8px rgba(107,255,176,.5);}
.hud b{color:#eafff2;}

.board-wrap{
  position:relative;border:2px solid rgba(0,255,140,.4);border-radius:6px;
  box-shadow:0 0 50px rgba(0,255,140,.15), inset 0 0 30px rgba(0,255,140,.04);
  background:#03110a;
}
canvas{display:block;}

.overlay{
  position:absolute;inset:0;background:rgba(2,10,6,.88);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;
}
.overlay.hidden{display:none;}
.overlay h2{color:#6bffb0;font-family:'VT323',monospace;font-size:2.2rem;letter-spacing:.04em;text-shadow:0 0 14px rgba(107,255,176,.6);}
.overlay p{color:#8affc1;font-size:.82rem;max-width:260px;line-height:1.5;}
.start-btn{
  background:rgba(0,255,140,.12);border:1px solid #6bffb0;color:#6bffb0;font-family:'Space Mono',monospace;
  font-weight:700;font-size:.85rem;padding:11px 26px;border-radius:6px;cursor:pointer;letter-spacing:.05em;
  transition:all .2s;
}
.start-btn:hover{background:rgba(0,255,140,.22);box-shadow:0 0 20px rgba(0,255,140,.3);}

.controls-hint{color:rgba(138,255,193,.5);font-size:.72rem;letter-spacing:.05em;text-align:center;}
.dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px;margin-top:4px;}
.dpad button{background:rgba(0,255,140,.1);border:1px solid rgba(0,255,140,.35);color:#6bffb0;border-radius:8px;font-size:18px;cursor:pointer;}
.dpad button:active{background:rgba(0,255,140,.25);}
#dUp{grid-column:2;grid-row:1;}#dLeft{grid-column:1;grid-row:2;}#dDown{grid-column:2;grid-row:2;}#dRight{grid-column:3;grid-row:2;}

.back-link{position:fixed;top:14px;left:14px;font-size:12px;color:#6bffb0;text-decoration:none;font-weight:700;background:rgba(0,255,140,.08);border:1px solid rgba(0,255,140,.3);padding:8px 14px;border-radius:4px;z-index:10;letter-spacing:.05em;backdrop-filter:blur(4px);transition:all .25s;}
.back-link:hover{background:rgba(0,255,140,.18);border-color:#6bffb0;}

@media(hover:none){.dpad{display:grid;}}
</style>
</head>
<body>
<a class="back-link" href="../index.html" onclick="if(window.history.length>1){history.back();return false;}">← Indietro</a>

<div class="wrap">
  <div class="hud">
    <span>PUNTEGGIO: <b id="score">0</b></span>
    <span>RECORD: <b id="best">0</b></span>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">SNAKE</h2>
      <p id="overlayText">Usa le frecce (o WASD) per muoverti. Mangia i punti rossi, non toccare i bordi né la coda.</p>
      <button class="start-btn" id="startBtn">▶ Inizia</button>
    </div>
  </div>

  <div class="controls-hint">frecce / WASD per muoversi · spazio per pausa</div>
  <div class="dpad">
    <button id="dUp">↑</button>
    <button id="dLeft">←</button>
    <button id="dDown">↓</button>
    <button id="dRight">→</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const CELLS = canvas.width / GRID;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const startBtn = document.getElementById('startBtn');

let snake, dir, nextDir, food, score, best, running, paused, loopId;

best = parseInt(localStorage.getItem('snake_best') || '0', 10);
bestEl.textContent = best;

function resetGame() {
  snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  scoreEl.textContent = 0;
  placeFood();
  paused = false;
}

function placeFood() {
  let valid = false;
  while (!valid) {
    food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
    valid = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function draw() {
  ctx.fillStyle = '#03110a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(0,255,140,0.05)';
  for (let i = 0; i <= CELLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
  }

  ctx.fillStyle = '#ff6b6b';
  ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 10;
  ctx.fillRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4);
  ctx.shadowBlur = 0;

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#8affc1' : '#2fd88a';
    ctx.shadowColor = '#00ff8c'; ctx.shadowBlur = i === 0 ? 12 : 4;
    ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
  });
  ctx.shadowBlur = 0;
}

function step() {
  if (paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  running = false;
  clearInterval(loopId);
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    bestEl.textContent = best;
  }
  overlayTitle.textContent = 'GAME OVER';
  overlayText.textContent = `Hai totalizzato ${score} punti. Vuoi riprovare?`;
  startBtn.textContent = '↻ Rigioca';
  overlay.classList.remove('hidden');
}

function startGame() {
  resetGame();
  draw();
  overlay.classList.add('hidden');
  running = true;
  clearInterval(loopId);
  loopId = setInterval(step, 110);
}

startBtn.addEventListener('click', startGame);

const keyMap = {
  ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 }
};

function setDirection(nd) {
  if (!running || paused) return;
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (running) paused = !paused; return; }
  if (keyMap[e.key]) { e.preventDefault(); setDirection(keyMap[e.key]); }
});

document.getElementById('dUp').addEventListener('click', () => setDirection({ x: 0, y: -1 }));
document.getElementById('dDown').addEventListener('click', () => setDirection({ x: 0, y: 1 }));
document.getElementById('dLeft').addEventListener('click', () => setDirection({ x: -1, y: 0 }));
document.getElementById('dRight').addEventListener('click', () => setDirection({ x: 1, y: 0 }));

resetGame();
draw();
</script>
</body>
</html>
